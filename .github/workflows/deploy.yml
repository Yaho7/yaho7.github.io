name: Deploy Astro to GitHub Pages

# 触发条件
on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ 检出仓库
      - uses: actions/checkout@v4

      # 2️⃣ 安装 Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm  # 如果用 pnpm/yarn，需要改

      # 3️⃣ 安装依赖
      - run: npm install

      # 4️⃣ 构建 Astro
      - run: npm run build

      # 5️⃣ 上传构建产物
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4